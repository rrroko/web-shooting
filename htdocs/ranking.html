<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking</title>
<style>
:root{color-scheme:dark;--bg0:#070a12;--bg1:#0b0b10;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.10);--text:#e8efff;--muted:rgba(232,239,255,.68);--accent:#60a5fa;--shadow:0 18px 50px rgba(0,0,0,.45);--r:18px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 15% -10%, rgba(96,165,250,.20), transparent 55%),radial-gradient(900px 600px at 95% 15%, rgba(251,113,133,.12), transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1));color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:26px 16px 40px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.title{display:flex;align-items:center;gap:12px}
.icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(37,99,235,.75));box-shadow:var(--shadow)}
h1{margin:0;font-size:24px;letter-spacing:.4px}
.sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:rgba(232,239,255,.92);font-size:12px}
.btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text);padding:10px 14px;border-radius:999px;cursor:pointer;transition:transform .12s ease, background .12s ease, border-color .12s ease}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
.btn.primary{border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.16)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.10);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel .hd{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.select{appearance:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:var(--text);padding:10px 12px;border-radius:14px;min-width:160px}
.hint{color:var(--muted);font-size:12px}
.tableWrap{overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
thead th{position:sticky;top:0;background:rgba(10,12,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.10);text-align:left;font-size:12px;color:rgba(232,239,255,.85);padding:10px 12px}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);color:rgba(232,239,255,.92)}
tbody tr:hover{background:rgba(255,255,255,.04)}
.rank{font-weight:800;color:rgba(232,239,255,.92)}
.score{font-weight:800}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12.5px;color:rgba(232,239,255,.78)}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);font-size:12px}
.footer{padding:12px 16px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
<script>
(async ()=>{
  try{
    const r=await fetch('/api/me.php',{credentials:'include'});
    if(!r.ok){location.href='/login.html';return;}
    const js=await r.json().catch(()=>null);
    document.addEventListener('DOMContentLoaded',()=>{document.getElementById('who').textContent=js?.player?.player_name??'';});
  }catch(e){location.href='/login.html';}
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">
      <div class="icon" aria-hidden="true"></div>
      <div>
        <h1>ランキング</h1>
        <div class="sub">上位スコアを確認できます</div>
      </div>
    </div>
    <div class="right">
      <span class="pill">👤 <b id="who"></b></span>
      <button class="btn" id="logout">ログアウト</button>
      <a class="btn primary" href="/menu.html">メニュー</a>
    </div>
  </div>

  <div class="panel">
    <div class="hd">
      <div class="controls">
        <select id="mode" class="select">
          <option value="survival">survival</option>
          <option value="story">story</option>
        </select>
        <select id="stage" class="select">
          <option value="">(全て)</option>
          <option value="1">Stage 1</option>
          <option value="2">Stage 2</option>
          <option value="3">Stage 3</option>
        </select>
        <button id="reload" class="btn">更新</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="tableWrap">
      <table>
        <thead>
          <tr><th style="width:64px">#</th><th>Player</th><th>Mode</th><th>Stage</th><th>Score</th><th>Time</th><th>Date</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="footer">
      <span>表示件数: 20</span>
      <span class="mono">survival はステージ無し（死ぬまで）</span>
    </div>
  </div>
</div>

<script type="module">
const $=s=>document.querySelector(s);
function fmtMs(ms){
  const s=Math.floor((ms||0)/1000);
  const m=Math.floor(s/60);
  const r=s%60;
  return m+":"+String(r).padStart(2,'0');
}
function updateStageSelect(){
  const mode=$('#mode').value;
  $('#stage').disabled=(mode!=='story');
  $('#hint').textContent=(mode==='survival')?'survival はステージ無し（死ぬまで）':'';
}
updateStageSelect();
$('#mode').onchange=()=>{updateStageSelect();load();};
$('#stage').onchange=()=>load();
$('#reload').onclick=()=>load();
$('#logout').onclick=async()=>{await fetch('/api/logout.php',{credentials:'include'});location.href='/login.html';};

async function load(){
  const mode=$('#mode').value;
  const stage=$('#stage').value;
  const qs=new URLSearchParams({mode,limit:'20'});
  if(mode==='story'&&stage) qs.set('stage',stage);
  const r=await fetch('/api/ranking.php?'+qs.toString(),{credentials:'include'});
  const js=await r.json().catch(()=>null);
  const rows=js?.rows??[];
  const tb=$('#tbody');tb.innerHTML='';
  rows.forEach((row,i)=>{
    const tr=document.createElement('tr');
    const created=(row.created_at??'').replace('T',' ');
    tr.innerHTML=`<td class="rank">${i+1}</td><td>${row.player_name??''}</td><td><span class="badge">${row.mode??''}</span></td><td>${row.stage??''}</td><td class="score">${row.score??0}</td><td class="mono">${fmtMs(row.duration_ms)}</td><td class="mono">${created}</td>`;
    tb.appendChild(tr);
  });
}
load();
</script>
</body>
</html>
