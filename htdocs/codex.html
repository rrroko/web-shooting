<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>図鑑</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body{margin:0;padding:32px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#fff;}
  h1{margin:0 0 6px;}
  .sub{opacity:.8;margin-bottom:18px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  button{padding:8px 14px;border-radius:999px;border:none;cursor:pointer;background:#334155;color:#fff;}
  button.primary{background:#1e40af;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .card{background:#111a33;border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,.08);}
  .title{font-size:14px;opacity:.95;margin-bottom:6px;}
  .locked{opacity:.35;filter:grayscale(1);}
  .meta{font-size:12px;opacity:.75;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .sep{height:1px;background:rgba(255,255,255,.08);margin:14px 0;}
  .ph{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:8px;}
  .ico{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;margin-bottom:8px;}
  .emo{font-size:40px;margin-bottom:8px;}
</style>
</head>
<body>
  <h1>図鑑</h1>
  <div class="sub">遭遇・撃破・入手・選択で自動的に埋まります（localStorage.codex）</div>

  <div class="row">
    <button class="primary" id="tab-enemy">敵</button>
    <button id="tab-item">素材</button>
    <button id="tab-weapon">武器</button>
    <button id="tab-ship">機体</button>
    <button id="btn-back">← メニュー</button>
    <button id="btn-forge">工房</button>
  </div>

  <div id="content"></div>

  <script src="/js/codex.js"></script>
</body>
</html>
